apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
spec:
  replicas: 1
  selector: { matchLabels: { app: ingestion } }
  template:
    metadata: { labels: { app: ingestion } }
    spec:
      containers:
        - name: ingestion
          image: analytics-ingestion:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: { name: analytics-secrets }
            - configMapRef: { name: analytics-config }
          ports: [{ containerPort: 8080 }]
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
spec:
  selector: { app: ingestion }
  ports: [{ port: 8080 }]
